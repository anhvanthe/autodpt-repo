[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodpt"
version = "0.2.0"
description = "Automated double pulse test (DPT) application: instrument control, switching analysis, reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
hw = ["pyvisa>=1.13", "pyvisa-py>=0.7"]
data = ["h5py>=3.9", "openpyxl>=3.1", "pandas>=2.0"]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13", "matplotlib>=3.8"]
report = ["matplotlib>=3.8", "reportlab>=4.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
autodpt = "autodpt.app:main"

[tool.setuptools.packages.find]
include = ["autodpt*"]

[tool.setuptools.package-data]
"autodpt.config" = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(*ids): SRS requirement IDs verified by this test (traceability, NFR-QUAL-02)",
    "slow: longer-running golden tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters / µ in docstrings and comments are intentional

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["autodpt.analysis.*", "autodpt.config.*"]
strict = true
